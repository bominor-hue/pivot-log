# Builds or updates the farm's Supabase database from supabase/migrations.
# Runs when a change to the database lands on main, or by hand from the Actions tab ("Run workflow").
# Needs three repository secrets (Settings > Secrets and variables > Actions):
#   SUPABASE_PROJECT_REF   the id in the dashboard address, e.g. idqgmfxrnjyumznskjfa
#   SUPABASE_ACCESS_TOKEN  supabase.com > Account > Access Tokens
#   SUPABASE_DB_PASSWORD   the database password chosen when the project was made
name: Database
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['supabase/migrations/**']
jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase link --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}"
      - run: supabase db push
